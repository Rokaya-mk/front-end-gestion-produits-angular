<div class="p-3">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>PRICE</th>
                    <th>SELECTED</th>
                </tr>
            </thead>
            @if(products){

                <tbody>
                    @for(product of products; track product.id)
                    {
    
                        <tr>
                            <td>{{ product.id }} </td>
                            <td>{{ product.name }} </td>
                            <td>{{ product.price }} </td>
                            <td>{{ product.selected }} </td>
                        </tr>
                    }
                </tbody>
            }
            
        </table>
    </div>
</div>
