<div class="p-3">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>PRICE</th>
                    <th>SELECTED</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            @if(products){

                <tbody>
                    @for(product of products; track product.id)
                    {
    
                        <tr>
                            <td>{{ product.id }} </td>
                            <td>{{ product.name }} </td>
                            <td>{{ product.price }} </td>
                            <td>
                                @if(product.selected)
                                {
                                    <i class="bi bi-check-circle"></i>
                                }
                                @else
                                {
                                    <i class="bi bi-circle"></i>
                                }
                            </td>
                            <td> 
                                <button (click)="hundleDelete(product)" class="btn btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    }
                </tbody>
            }
            
        </table>
    </div>
</div>
